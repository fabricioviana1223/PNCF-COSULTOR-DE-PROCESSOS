<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Sistemas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-glow: rgba(59, 130, 246, 0.5);
      --success: #10B981;
      --success-glow: rgba(16, 185, 129, 0.5);
      --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: radial-gradient(circle at top, #1e293b 0%, transparent 40%);
    }

    .hero-container {
      text-align: center;
      max-width: 1000px;
      padding: 2rem;
      z-index: 10;
    }

    /* Animações de entrada */
    .animate-fade-down {
      animation: fadeDown 1s ease-out forwards;
      opacity: 0;
      transform: translateY(-20px);
    }
    
    .animate-fade-up {
      animation: fadeUp 1s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
      animation-delay: 0.3s;
    }

    @keyframes fadeDown {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cabeçalho */
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, #FFFFFF 0%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 1.25rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 4rem;
    }

    /* Container dos Cards (Estilo Netflix) */
    .cards-grid {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      width: 320px;
      height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-main);
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.05);
      transition: var(--transition);
      overflow: hidden;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    /* Efeito de brilho no fundo do card */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 100%);
      z-index: 1;
      transition: var(--transition);
    }

    .card-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .card-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      transition: var(--transition);
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      transition: var(--transition);
    }

    /* Efeitos de Hover - Onde a mágica "Netflix" acontece */
    .card:hover {
      transform: scale(1.05) translateY(-10px);
      z-index: 10;
    }

    .card:hover .card-icon {
      transform: scale(1.1) translateY(-5px);
    }

    .card:hover .card-desc {
      opacity: 1;
      transform: translateY(0);
    }

    /* Cores Específicas para cada Card */
    .card.minuta:hover {
      border-color: var(--success);
      box-shadow: 0 20px 40px var(--success-glow);
    }
    .card.minuta:hover::before {
      background: linear-gradient(180deg, rgba(16,185,129,0.1) 0%, rgba(0,0,0,0.4) 100%);
    }

    .card.visualizador:hover {
      border-color: var(--primary);
      box-shadow: 0 20px 40px var(--primary-glow);
    }
    .card.visualizador:hover::before {
      background: linear-gradient(180deg, rgba(59,130,246,0.1) 0%, rgba(0,0,0,0.4) 100%);
    }

    /* Responsividade */
    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      .cards-grid { flex-direction: column; align-items: center; }
      .card { width: 100%; max-width: 320px; height: 350px; }
      .card-desc { opacity: 1; transform: none; } /* Sempre visível no mobile */
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="animate-fade-down">
      <h1>Portal de Sistemas PNCF</h1>
      <p class="subtitle">O que você deseja acessar?</p>
    </div>

    <div class="cards-grid animate-fade-up">
      
      <!-- CARD 1: MINUTA DE OFÍCIO -->
      <!-- ATENÇÃO: Altere o href para o nome correto do seu arquivo da Minuta -->
      <a href="minuta.html" class="card minuta">
        <div class="card-content">
          <div class="card-icon">📝</div>
          <div class="card-title">Minuta de Ofício</div>
          <div class="card-desc">Consulte dados PNCF e gere modelos padronizados com padrão para utilizar no SEI.</div>
        </div>
      </a>

      <!-- CARD 2: VISUALIZADOR DE PROCESSOS -->
      <!-- ATENÇÃO: Altere o href para o nome correto do seu arquivo do Visualizador -->
      <a href="visualizador.html" class="card visualizador">
        <div class="card-content">
          <div class="card-icon">📊</div>
          <div class="card-title">Visualizador de Processos</div>
          <div class="card-desc">Consulte e analise os processos em andamento por etapa, UF e atividade atual no painel analítico.</div>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
